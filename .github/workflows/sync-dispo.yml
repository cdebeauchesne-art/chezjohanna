name: Synchro disponibilités Airbnb

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dispo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lire les calendriers Airbnb
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
        run: node sync-ical.mjs
      - name: Publier si changement
        run: |
          if [ -n "$(git status --porcelain dispo.json)" ]; then
            git config user.name "chezjohanna-bot"
            git config user.email "actions@users.noreply.github.com"
            git add dispo.json
            git commit -m "Disponibilités mises à jour"
            git push
          fi
